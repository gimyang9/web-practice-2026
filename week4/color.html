<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            font-size: 20px;
        }
        .px{
            font-size: 20px;
        }
        .rem{
            font-size: 2rem;
        }
        .wrap_em{
            font-size: 20px;
        }
        .em{
            font-size: 2em;
        }
        .vw{
            font-size: 10vw;
        }
        .vh{
            font-size: 10vh;
        }
        .wrap_per{
            font-size: 20px;
        }
        .percent{
            font-size: 200%;
        }
        .six{
            color: #ffdd00;
        }
        .rgba{
            color: rgba(255, 221, 0, 0.5);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbit&display=swap" rel="stylesheet">
</head>
<body>
    <h1>단위</h1>
    <p class = "px">px 크기</p>
    <p class = "rem">rem 크기</p>
    <div class = "wrap_em">
        <p class = "em">em 크기</p>
    </div>
    <p class = "percent">퍼센트 크기</p>
    <p class = "vw">vw 크기</p>
    <p class = "vh">vh 크기</p>
    <div class = "wrap_per">
        <p class = "percent">퍼센트 크기</p>
    </div>
    <hr>
    <h1>색상</h1>
    <p class = "six">16진수 표기법</p>
    <p class = "rgba">rgba 표기법</p>
</body>
</html>
